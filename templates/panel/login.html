{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | Panel Como Arroz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'panel/panel.css' %}">
</head>
<body class="panel-body">
<div class="panel-login-wrap">
    <div class="panel-login-card">
        <div class="text-center mb-4">
            <span class="brand-como" style="font-size:1.4rem;">COMO</span><span class="brand-arroz" style="font-size:1.4rem;">ARROZ</span>
            <div class="text-secondary mt-1">Panel administrativo</div>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username" class="form-control" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-rojo w-100">Ingresar</button>
        </form>
    </div>
</div>
</body>
</html>
