{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Panel{% endblock %} | Como Arroz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{% static 'panel/panel.css' %}">
</head>
<body class="panel-body">
<div class="panel-layout">
    <aside class="panel-sidebar">
        <div class="panel-marca d-flex justify-content-between align-items-center">
            <div>
                <span class="brand-como">COMO</span><span class="brand-arroz">ARROZ</span>
                <small>Panel administrativo</small>
            </div>
            <button type="button" class="btn btn-sm btn-accion d-lg-none" data-bs-toggle="collapse" data-bs-target="#panelNav" aria-controls="panelNav" aria-label="Abrir menú">
                <i class="bi bi-list"></i>
            </button>
        </div>
        <nav class="panel-nav collapse d-lg-block" id="panelNav">
            <a href="{% url 'panel_dashboard' %}" class="{% if request.resolver_match.url_name == 'panel_dashboard' %}activo{% endif %}">
                <i class="bi bi-speedometer2 me-2"></i> Inicio
            </a>
            <a href="{% url 'menu_panel:categoria_list' %}" class="{% if 'categoria' in request.resolver_match.url_name %}activo{% endif %}">
                <i class="bi bi-tags me-2"></i> Categorías
            </a>
            <a href="{% url 'menu_panel:producto_list' %}" class="{% if 'producto' in request.resolver_match.url_name %}activo{% endif %}">
                <i class="bi bi-egg-fried me-2"></i> Productos
            </a>
            <a href="{% url 'menu_panel:combo_list' %}" class="{% if 'combo' in request.resolver_match.url_name %}activo{% endif %}">
                <i class="bi bi-box-seam me-2"></i> Combos
            </a>
            <a href="{% url 'pedidos_panel:punto_list' %}" class="{% if 'punto' in request.resolver_match.url_name %}activo{% endif %}">
                <i class="bi bi-geo-alt me-2"></i> Puntos de recogida
            </a>
            <a href="{% url 'pedidos_panel:pedido_list' %}" class="{% if 'pedido' in request.resolver_match.url_name %}activo{% endif %}">
                <i class="bi bi-receipt me-2"></i> Pedidos
            </a>
            <a href="{% url 'cuentas_panel:usuario_list' %}" class="{% if 'usuario' in request.resolver_match.url_name %}activo{% endif %}">
                <i class="bi bi-people me-2"></i> Usuarios
            </a>
            <a href="{% url 'panel_logout' %}" class="salir">
                <i class="bi bi-box-arrow-right me-2"></i> Salir
            </a>
        </nav>
    </aside>

    <main class="panel-main">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
