{% extends "panel/base.html" %}
{% block titulo %}Eliminar{% endblock %}
{% block contenido %}
<div class="panel-header">
    <h1>{{ titulo }}</h1>
</div>
<div class="panel-card" style="max-width: 480px;">
    {% if advertencia %}
        <p class="text-danger"><i class="bi bi-exclamation-triangle me-1"></i>{{ advertencia }}</p>
    {% endif %}
    <p class="text-secondary">Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
